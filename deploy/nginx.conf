# VPS 样例：把 80/443 反代到本机 3000（ayi-kaoqin 服务）。
# 用法：
#   1) 把本文件放到 /etc/nginx/conf.d/ayi-kaoqin.conf
#   2) 改 server_name 为你的域名，确保 DNS 已指向本机
#   3) 用 certbot 申请证书：certbot --nginx -d 你的域名
#      certbot 会自动改写本文件，补上 listen 443 ssl 与证书路径
#   4) nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name your-domain.example.com;   # ← 改成你的域名

    client_max_body_size 10m;

    # API：反代到后端，禁用缓存
    location /api {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store";
    }

    # 前端（SPA）：由 Node 服务做 history 兜底，这里直接反代即可
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
